replicaCount: 1

image:
  repository: ghcr.io/propastinv/site-operator/operator
  tag: "0.1.6"
  pullPolicy: IfNotPresent
  # Optional: names of existing imagePullSecrets, e.g. for a private registry.
  # pullSecrets:
  #   - my-registry-secret
  pullSecrets: []

service:
  type: ClusterIP
  port: 80

# Real, scheduled wp-cron for every Site, instead of relying on WordPress's
# own page-load-triggered pseudo-cron (unreliable on low-traffic sites).
# wp-config.php always sets DISABLE_WP_CRON, so if this is turned off, no
# cron events run for any site at all.
wpCron:
  enabled: true
  schedule: "*/5 * * * *"

# Cluster-wide defaults applied to any Site that doesn't set the equivalent
# field itself — a Site's own spec always wins over these.
defaults:
  # Lets Sites omit spec.provision.database.mariadbRef and fall back to this
  # MariaDB cluster (managed by mariadb-operator,
  # https://github.com/mariadb-operator/mariadb-operator) when the operator
  # provisions Database/User/Grant objects. Only used when a Site sets
  # spec.provision.database.enabled: true. Leave name empty to require every
  # Site to specify its own mariadbRef.
  mariadbRef:
    name: ""
    namespace: ""
  # Lets Sites omit spec.persistence.storageClassName and fall back to this
  # StorageClass. Leave empty to fall back to the cluster's default
  # StorageClass instead.
  storageClassName: ""
