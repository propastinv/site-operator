apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: site-operator
  template:
    metadata:
      labels:
        app: site-operator
    spec:
      serviceAccountName: site-operator
      containers:
        - name: site-operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.provision.database.mariadbRef.name }}
          args:
            - --default-mariadb-name={{ .Values.provision.database.mariadbRef.name }}
            - --default-mariadb-namespace={{ .Values.provision.database.mariadbRef.namespace }}
          {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}

